<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ZamanRadarı · YouTube için STOP Kalkanı</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="brand">
      <span class="mark" aria-hidden="true">🛑</span>
      <div class="brand-text">
        <span class="brand-title">ZAMAN RADARI</span>
        <span id="brand-sub" class="brand-sub">Bilişsel YouTube Kalkanı</span>
      </div>
    </div>
    <div class="header-right">
      <div class="lang-switch" role="group" aria-label="Dil / Language">
        <button type="button" id="lang-tr" class="lang-btn active" data-lang="tr">TR</button>
        <button type="button" id="lang-en" class="lang-btn" data-lang="en">EN</button>
      </div>
      <span id="badge" class="badge">Bağlı değil</span>
    </div>
  </header>

  <main>
    <!-- Kompakt Telemetri & Hafıza Çubuğu -->
    <div class="telemetry-bar">
      <div class="telemetry-item">
        <span class="telemetry-dot"></span>
        <span id="telemetry-label" class="telemetry-label">Kalıcı Hafıza:</span>
        <b id="cached">0</b>
        <span id="telemetry-unit" class="telemetry-unit">video (0 ms)</span>
      </div>
      <button id="clear" class="subtle-btn" type="button" title="Hafızadaki videoları temizle">Temizle</button>
    </div>

    <!-- API Anahtarı Formu -->
    <form id="key-form" class="key-form">
      <div class="field-header">
        <label id="api-key-label" for="api-key">TypeSafe API Anahtarı</label>
        <button type="button" id="reveal" class="text-link" aria-label="API anahtarını göster">Göster</button>
      </div>
      <div class="input-row">
        <input id="api-key" name="api-key" type="password" autocomplete="off" spellcheck="false" placeholder="Anahtarını buraya gir" minlength="8" maxlength="2048">
        <button class="primary-btn" type="submit" id="save" title="Kaydet">
          <span id="save-text">Kaydet</span>
        </button>
      </div>
      <div class="checkbox-row">
        <label class="checkbox-label" for="remember-key">
          <input type="checkbox" id="remember-key" name="remember-key" checked>
          <span id="remember-key-text">Bu cihazda hatırla (Kalıcı sakla)</span>
        </label>
      </div>
    </form>

    <!-- Radar Aç / Kapat Şeridi -->
    <div class="toggle-card">
      <div class="toggle-info">
        <span id="toggle-title" class="toggle-title">Otomatik STOP Radarı</span>
        <small id="toggle-desc" class="toggle-desc">Küçük resimlerde 🛑 damgalar ve blur</small>
      </div>
      <label class="switch" title="Radarı Aç / Kapat">
        <input id="enabled" type="checkbox" aria-label="Otomatik STOP Radarı">
        <span></span>
      </label>
    </div>

    <p id="feedback" role="status" aria-live="polite"></p>

    <!-- Hızlı Eylemler -->
    <div class="bottom-actions">
      <button id="test" type="button" class="action-btn">⚡ Hızlı Test</button>
      <button id="forget" type="button" class="action-btn danger">Anahtarı Sil</button>
    </div>
  </main>

  <footer>
    <span id="footer-version">v1.1.0 · Jev System One</span>
    <span><span id="session-calls-label">Oturum İstek:</span> <b id="calls">0</b></span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
